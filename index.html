<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shree Bhargava Infrastructure & Development</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary-dark: #11161e;
            --secondary-dark: #1a212d;
            --gold: #ffa500;
            --gold-hover: #e65c00;
            --text-light: #ffffff;
            --text-muted: #a0aab5;
            --text-dark: #333333;
            --bg-light: #f9f9f9;
            --white: #ffffff;
            --transition: all 0.4s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            line-height: 1.6;
            color: var(--text-dark);
            background-color: var(--white);
            overflow-x: hidden;
        }

        html {
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        section,
        div[id] {
            scroll-margin-top: 90px;
        }

        header {
            background-color: var(--primary-dark);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 102, 0, 0.2);
            width: 100%;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
        }

        .logo {
            min-width: 0;
            flex: 1;
        }

        .logo h1 {
            color: var(--gold);
            font-size: 1.25rem;
            font-weight: 700;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .logo span {
            display: block;
            font-size: 0.58rem;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 22px;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-muted);
            font-size: 0.82rem;
            text-transform: uppercase;
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
            white-space: nowrap;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--gold);
        }

        .menu-toggle {
            display: none;
            font-size: 1.3rem;
            color: var(--gold);
            cursor: pointer;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 165, 0, 0.3);
            flex-shrink: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
        }

        /* Bulletproof Mobile & Tablet Dropdown Navbar Fix */
        @media (max-width: 1200px) {
            .menu-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background-color: var(--primary-dark);
                padding: 20px;
                border-bottom: 2px solid rgba(255, 165, 0, 0.3);
                box-shadow: 0 15px 30px rgba(0, 0, 0, 0.8);
                gap: 12px;
                text-align: center;
                z-index: 999;
            }

            .nav-links.active {
                display: flex !important;
            }

            .nav-links li {
                width: 100%;
            }

            .nav-links a {
                font-size: 0.9rem;
                display: block;
                padding: 12px;
                background: rgba(255, 255, 255, 0.05);
                border-radius: 6px;
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="navbar">
            <div class="logo">
                <h1>SHREE BHARGAVA</h1>
                <span>Infrastructure & Development</span>
            </div>
            <!-- Hamburger Menu Toggle Button (Right Corner) -->
            <div class="menu-toggle" onclick="toggleMenu()">
                <i class="fa-solid fa-bars"></i>
            </div>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="#about">About Us</a></li>
                <li><a href="#services">Services</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#process">Our Process</a></li>
                <li><a href="careers.html">Careers</a></li>
            </ul>
        </div>
    </header>

    <script>
        function toggleMenu() {
            const navLinks = document.getElementById('navLinks');
            navLinks.classList.toggle('active');
        }
    </script>
</body>

</html>
